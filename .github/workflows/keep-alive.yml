name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          for i in 1 2 3; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 90 \
              https://insurance-backend-c2s2.onrender.com/health) && \
              echo "Attempt $i: HTTP $code" && \
              [ "$code" = "200" ] && exit 0
            echo "Attempt $i failed, retrying..."
            sleep 15
          done
          exit 1
